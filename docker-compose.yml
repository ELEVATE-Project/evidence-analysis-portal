version: "3.9"

services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: evidence-analysis-portal:latest
    container_name: evidence-analysis-portal
    env_file:
      - .env
    ports:
      - "4173:4173"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4173/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
